name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-guard:
    name: No credential files tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if env or service-account files are committed
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)|serviceAccountKey\.json$|service-account.*\.json$' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Credential files must not be committed:"
            echo "$tracked"
            exit 1
          fi

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          # Placeholder values so the build doesn't depend on real config.
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          VITE_REACT_APP_API_KEY: http://localhost:4000

  backend:
    name: Backend (syntax, Prisma schema)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Syntax-check every source file
        run: git ls-files '*.js' | xargs -n1 node --check
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
