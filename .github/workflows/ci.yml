name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-guard:
    name: No credential files tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if env or service-account files are committed
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)|serviceAccountKey\.json$|service-account.*\.json$' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Credential files must not be committed:"
            echo "$tracked"
            exit 1
          fi

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          # Placeholder values so the build doesn't depend on real config.
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          VITE_REACT_APP_API_KEY: http://localhost:4000

  backend:
    name: Backend (schema, drift, typecheck, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          # Scratch database for the drift check; tests create their own databases.
          POSTGRES_DB: events_shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/events_shadow
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/events_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Validate Prisma schema
        run: npm run prisma:validate
      - name: Schema drift (schema.prisma must equal the migrations)
        run: npm run prisma:drift
      - name: Typecheck (checkJs)
        run: npm run typecheck
      - name: Syntax-check every source file
        run: git ls-files '*.js' | xargs -n1 node --check
      - name: Migrations apply to an empty database
        run: |
          psql "$TEST_DATABASE_ADMIN_URL" -c 'CREATE DATABASE ci_fresh'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ci_fresh npx prisma migrate deploy
      - name: Tests (auth, authorization, lifecycle, verification, booking concurrency, migrations)
        run: npm test
